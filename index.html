    <!-- Prato 10x: bootstrap de tracking antes de qualquer tag externa. -->
    <script>
      (function(w) {
        var params = new URLSearchParams(w.location.search);
        var internalTest = params.get('internal_test') === '1';

        w.__PRATO10X_INTERNAL_TEST__ = internalTest;
        w.dataLayer = w.dataLayer || [];
        w.dataLayer.push({
          event: 'prato10x_boot',
          internal_test: internalTest ? '1' : '0',
          debug_mode: internalTest
        });

        if (internalTest) {
          /*
           * Em QA, o Meta Pixel de produção fica neutralizado antes do GTM.
           * Isso também impede snippets Meta padrão disparados pelo GTM de
           * inicializarem o fbq nessa sessão.
           */
          var noop = function() {};
          noop.callMethod = noop;
          noop.queue = [];
          noop.push = noop;
          noop.loaded = true;
          noop.version = '2.0';
          w.fbq = noop;
          w._fbq = noop;
          console.info('[Prato 10x] Modo teste: Meta Pixel de produção bloqueado.');
        }
      })(window);
    </script>

      'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);

    </script>
